services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
    environment:
      - PORT=${PORT:-3000}
      - DB_HOST=db
      - DB_NAME=togglemaster
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:13
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=togglemaster
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d togglemaster"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: